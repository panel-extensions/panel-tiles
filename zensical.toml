[project]
site_name = "panel-tiles"
site_description = "A draggable, resizable grid layout for Panel applications"
site_author = "HoloViz Developers"
site_url = "https://panel-extensions.github.io/panel-tiles"
site_dir = "builtdocs"
repo_url = "https://github.com/panel-extensions/panel-tiles"
repo_name = "panel-extensions/panel-tiles"
edit_uri = "edit/main/docs/"
nav = [
  {"Home" = "index.md"},
  {"How-to" = [
    {"Basic Grid" = "how_to/basic_grid.md"},
    {"Dynamic Tiles" = "how_to/dynamic_tiles.md"},
    {"Close Action" = "how_to/close_action.md"},
    {"Local Save" = "how_to/local_save.md"},
    {"Read-Only" = "how_to/read_only.md"},
  ]},
  {"Reference" = "reference/panel-tiles.md"},
]

[project.theme]
variant = "modern"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "blue"

[project.theme.palette.toggle]
icon = "material/brightness-7"
name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "black"

[project.theme.palette.toggle]
icon = "material/brightness-4"
name = "Switch to light mode"

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.admonition]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.plugins]
search = {}

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
show_if_no_docstring = true
filters = ["!^_"]

[project.extra]

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/panel-extensions/panel-tiles"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/panel-tiles/"
